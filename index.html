<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Mycard · 学习卡片</title>
  <meta name="description" content="Mycard 学习卡片：基于艾宾浩斯遗忘曲线的间隔重复记忆应用。翻转记忆 + 关卡闯关 + 离线可用。">
  <meta name="theme-color" content="#0b0d17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mycard">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // 防闪屏：在样式表生效前按已保存的明暗模式写 <html data-theme>（与 theme.js 的 resolveMode 一致）
    try {
      var m = localStorage.getItem('mycard-mode');
      var light = m === 'light'
        ? true
        : m === 'system'
          ? !(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
          : false; // 无记录 / 深色 → 深色（默认主题）
      var t = light ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#f4f5fa' : '#0b0d17');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <div id="app">
    <header class="appbar glass-soft" id="appbar">
      <button class="appbar-btn back-btn" id="appbar-back" data-action="nav-back" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="appbar-title" id="appbar-title">Mycard</h1>
      <div class="appbar-side" id="appbar-side"></div>
    </header>

    <main id="view" aria-live="polite"></main>
  </div>

  <noscript>
    <div style="padding:24px;text-align:center">Mycard 需要启用 JavaScript 才能使用。</div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
